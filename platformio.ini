[env:m5stack-atoms3]
; espressif32 6.x = arduino-esp32 2.0.17 (ESP-IDF 4.4, mbedTLS 2.28).
; cert_store.cpp relies on the mbedTLS 2.x API, so keep this pinned.
platform = espressif32@6.10.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.embed_txtfiles =
    src/web/index.html
    src/web/unavailable.html
    certs/letsencrypt_roots.pem
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Reject oversized frames before allocating, and reuse one RX buffer so the
    ; no-PSRAM heap does not fragment under a stream of interim results.
    -DPSYCHIC_WS_MAX_FRAME_SIZE=4096
    -DPSYCHIC_WS_RX_STATIC_BUFFER
lib_deps =
    m5stack/M5Unified@^0.2.22
    hoeken/PsychicHttp@^3.1.2
    bblanchon/ArduinoJson@^7.4.3
