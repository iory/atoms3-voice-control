<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>AtomS3 Voice</title>
<style>
  :root { --bg:#f5f5f2; --fg:#1b1b1b; --muted:#6b6b6b; --card:#fff; --line:#ddd; --accent:#1f6feb; --ok:#1a7f37; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1c1c1c; --line:#333; --accent:#4c8dff; --ok:#3fb950; --bad:#ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:16px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:520px; margin:0 auto; display:grid; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .status { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:14px; }
  .status dt { color:var(--muted); }
  .status dd { margin:0; font-variant-numeric:tabular-nums; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select, input, button { font:inherit; }
  #talk {
    width:100%; height:180px; border:0; border-radius:16px; background:var(--accent); color:#fff;
    font-size:22px; font-weight:600;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  #talk.listening { background:var(--bad); }
  #talk:disabled { opacity:.4; }
  #interim { min-height:3em; color:var(--muted); }
  #final { min-height:1.5em; font-size:20px; }
  #log { font-size:13px; color:var(--muted); max-height:10em; overflow:auto; margin:0; padding-left:1.2em; }
  #error { color:var(--bad); white-space:pre-wrap; }
  #error:empty { display:none; }
</style>
</head>
<body>
<main>
  <dl class="card status">
    <dt>Secure context</dt><dd id="st-secure"></dd>
    <dt>SpeechRecognition</dt><dd id="st-speech"></dd>
    <dt>WebSocket</dt><dd id="st-ws">connecting</dd>
    <dt>Round trip</dt><dd id="st-rtt">-</dd>
  </dl>

  <div class="card row">
    <label>言語 <select id="lang"><option value="ja-JP">日本語</option><option value="en-US">English</option></select></label>
    <label>方式 <select id="mode"><option value="hold">押している間</option><option value="toggle">タップで開始/停止</option></select></label>
  </div>

  <button id="talk" disabled>押して話す</button>

  <div class="card">
    <div id="final"></div>
    <div id="interim"></div>
  </div>

  <div id="error" class="card"></div>

  <form id="manual" class="card row">
    <input id="manual-text" placeholder="音声なしで文字を送る" style="flex:1; min-width:0">
    <button>送信</button>
  </form>

  <ol id="log" class="card" reversed></ol>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const RECONNECT_MAX_MS = 5000;
const LOG_MAX = 30;

function setStatus(id, text, good) {
  const el = $(id);
  el.textContent = text;
  el.className = good === undefined ? "" : good ? "ok" : "bad";
}
function showError(message) { $("error").textContent = message; }

setStatus("st-secure", String(window.isSecureContext), window.isSecureContext);
setStatus("st-speech", Recognition ? "available" : "not available", !!Recognition);

// ---- WebSocket ----
let ws = null;
let seq = 0;
let reconnectDelay = 500;

function connect() {
  ws = new WebSocket(`wss://${location.host}/ws`);
  setStatus("st-ws", "connecting");
  ws.onopen = () => { reconnectDelay = 500; setStatus("st-ws", "open", true); };
  ws.onclose = () => {
    setStatus("st-ws", `closed, retry in ${reconnectDelay}ms`, false);
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_MS);
  };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "ack" && typeof msg.t === "number") {
      setStatus("st-rtt", `${(performance.now() - msg.t).toFixed(0)} ms (#${msg.seq})`);
    } else if (msg.type === "error") {
      showError(`AtomS3: ${msg.message}`);
    }
  };
}

function send(text, isFinal) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    showError("WebSocket が開いていないので送れませんでした");
    return;
  }
  ws.send(JSON.stringify({ type: "speech", seq: ++seq, text, final: isFinal, t: performance.now() }));
  if (isFinal) {
    const li = document.createElement("li");
    li.textContent = text;
    $("log").prepend(li);
    while ($("log").children.length > LOG_MAX) $("log").lastChild.remove();
  }
}

connect();

$("manual").onsubmit = (ev) => {
  ev.preventDefault();
  const text = $("manual-text").value.trim();
  if (text) send(text, true);
  $("manual-text").value = "";
};

// ---- Speech recognition ----
const talk = $("talk");
let recognition = null;
let wanted = false;     // user wants to be listening
let active = false;     // recognition session is running

function updateButton() {
  const hold = $("mode").value === "hold";
  talk.classList.toggle("listening", active);
  talk.textContent = active ? (hold ? "離すと停止" : "タップで停止") : (hold ? "押して話す" : "タップで開始");
}

function start() {
  if (active) return;
  showError("");
  recognition.lang = $("lang").value;
  try {
    recognition.start();
  } catch (e) {
    showError(`start() failed: ${e.message}`);
  }
}

if (Recognition) {
  recognition = new Recognition();
  recognition.interimResults = true;
  recognition.continuous = true;

  recognition.onstart = () => { active = true; updateButton(); };
  recognition.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      const text = r[0].transcript;
      if (r.isFinal) {
        $("final").textContent = text;
        send(text, true);
      } else {
        interim += text;
      }
    }
    $("interim").textContent = interim;
    if (interim) send(interim, false);
  };
  recognition.onerror = (ev) => {
    // "no-speech" / "aborted" are routine; anything else is worth surfacing.
    if (ev.error !== "no-speech" && ev.error !== "aborted") {
      showError(`SpeechRecognition error: ${ev.error}${ev.message ? " - " + ev.message : ""}`);
      wanted = false;
    }
  };
  recognition.onend = () => {
    active = false;
    $("interim").textContent = "";
    updateButton();
    // iOS Safari ends sessions after silence even with continuous=true.
    if (wanted) start();
  };

  talk.disabled = false;
  talk.addEventListener("contextmenu", (ev) => ev.preventDefault());
  talk.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    if ($("mode").value === "hold") {
      wanted = true;
      start();
    } else if (wanted) {
      wanted = false;
      recognition.stop();
    } else {
      wanted = true;
      start();
    }
  });
  const release = () => {
    if ($("mode").value === "hold" && wanted) {
      wanted = false;
      recognition.stop();
    }
  };
  talk.addEventListener("pointerup", release);
  talk.addEventListener("pointercancel", release);
  $("mode").onchange = () => {
    wanted = false;
    if (active) recognition.abort();
    updateButton();
  };
} else {
  showError("このブラウザでは SpeechRecognition が使えません。下の入力欄から文字送信だけ試せます。");
}
updateButton();
</script>
</body>
</html>
